apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qg-atlas-browser-worker
  labels:
    app.kubernetes.io/name: qg-atlas-browser-worker
    app.kubernetes.io/part-of: aiops-image-sync
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qg-atlas-browser-worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qg-image-sync
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - port: 8790
          protocol: TCP
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

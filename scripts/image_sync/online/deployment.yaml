apiVersion: apps/v1
kind: Deployment
metadata:
  name: qg-atlas-browser-worker
  labels:
    app.kubernetes.io/name: qg-atlas-browser-worker
    app.kubernetes.io/part-of: aiops-image-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qg-atlas-browser-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qg-atlas-browser-worker
        app.kubernetes.io/part-of: aiops-image-sync
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: aiops-tcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: atlas-browser-worker:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8790
          env:
            - name: QG_BROWSER_CHROME_PATH
              value: /usr/bin/chromium
            - name: QG_BROWSER_BIND_HOST
              value: 0.0.0.0
            - name: QG_BROWSER_HEADLESS
              value: "false"
            - name: QG_BROWSER_DISPLAY_MODE
              value: ozone-headless
            - name: QG_BROWSER_REQUIRE_PROXY
              value: "false"
            - name: QG_BROWSER_PROFILE_DIR
              value: /tmp/atlas-browser-profile
            - name: QG_BROWSER_PORT
              value: "8790"
            - name: QG_BROWSER_CDP_PORT
              value: "9231"
            - name: QG_BROWSER_MIN_INTERVAL_MS
              value: "1500"
            - name: QG_BROWSER_MAX_INTERVAL_MS
              value: "2000"
            - name: QG_BROWSER_PROXY_SERVER
              valueFrom:
                secretKeyRef:
                  name: qg-atlas-browser-worker
                  key: proxy-server
                  optional: true
            - name: QG_BROWSER_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qg-atlas-browser-worker
                  key: bridge-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

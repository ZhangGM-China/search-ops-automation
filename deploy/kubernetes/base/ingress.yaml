apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops
  namespace: aiops-demo
  annotations:
    kubernetes.io/ingress.class: qcloud
spec:
  ingressClassName: qcloud
  rules:
    - host: ops.example.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http

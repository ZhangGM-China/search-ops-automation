# --- 系统运行配置 ---
system_config:
  health_check_interval_minutes: 60 # 服务健康检查轮询间隔(分钟)
  no_result_agent_enabled: false # 无结果治理独立 Agent 总开关，品牌开关仍在 brand_configs 中控制
  no_result_governance_interval_minutes: 15 # 无结果词治理推进轮询间隔(分钟)
  no_result_governance_cycle_limit: 5 # 无结果词治理每轮最多推进数量

# --- 页面展示配置 ---
page_config:
  schemaVersion: 1
  version: 0
  values:
    brand_overview.show_operational_data: true
    brand_detail.show_query_metrics: true

# --- 系统安全配置 ---
safety_config:
  circuit_breaker_threshold: 10  # 接口连续失败熔断阈值
  max_retry_count: 3             # 接口调用或工作流重试次数
  api_delay_threshold: 5         # 接口响应延迟告警阈值 (秒)
  health_check_stale_minutes: 90 # 任务卡死/会话陈旧判定阈值(分钟)
  health_check_error_rate_threshold_percent: 20 # 最近一小时失败率告警阈值
  health_check_api_p95_threshold_seconds: 5 # 最近一小时接口 P95 告警阈值(秒)


# --- 搜索解析规则 ---
search_rules:
  atlas:
    enable_tag_parsing: true
    tag_map:
      "男士": "MAN"
      "女士": "WOMAN"
      "儿童": "KID"
      "家居": "HOME"
    handle_type: "200"
    filter_dimension: "gender"

# --- 品牌特定配置 ---
